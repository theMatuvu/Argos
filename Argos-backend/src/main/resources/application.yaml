spring:
  application:
    name: Argos-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/app}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations:
        - classpath:data.sql
        - classpath:network.sql
        - classpath:equipment.sql
        - classpath:provider.sql
        - classpath:incident.sql

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

springdoc:
  show-login-endpoint: true
  swagger-ui:
    csrf:
      enabled: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health