<header>
  @if (currentUser(); as user) {
    Bonjour {{ user.firstName }} ({{ profileLabels[user.profile] }}) |
    <button type="button" (click)="logout()">Déconnectez-vous</button>
  }
</header>

@if (currentUser()) {
  <h2>Créer un compte</h2>
  <form (ngSubmit)="createUser()">
    <input name="firstName" placeholder="Prénom" [(ngModel)]="newUser.firstName" />
    <input name="lastName" placeholder="Nom" [(ngModel)]="newUser.lastName" />
    <input name="username" placeholder="Identifiant" [(ngModel)]="newUser.username" />
    <input name="password" type="password" placeholder="Mot de passe" [(ngModel)]="newUser.password" />
    <select name="profile" [(ngModel)]="newUser.profile">
      <option value="FIELD_AGENT">Agent de terrain</option>
      <option value="OPERATIONS_MANAGER">Responsable d'exploitation</option>
    </select>
    <button type="submit">Créer</button>
  </form>
} @else {
  <h1>Connexion</h1>
  <form (ngSubmit)="login()">
    <input name="username" placeholder="Identifiant" [(ngModel)]="credentials.username" />
    <input name="password" type="password" placeholder="Mot de passe" [(ngModel)]="credentials.password" />
    <button type="submit">Se connecter</button>
  </form>
}

@if (message()) {
  <p>{{ message() }}</p>
}
