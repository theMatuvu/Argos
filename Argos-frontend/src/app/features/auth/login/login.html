<section class="card login-card">
  <div class="login-brand">
    <app-logo class="login-logo" />
    <h1 class="login-title">Argos</h1>
    <p class="login-subtitle">Supervision des équipements et suivi des incidents</p>
  </div>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label class="form-label" for="username">Identifiant</label>
      <input id="username" class="input" formControlName="username" autocomplete="username" />
      @if (errorFor('username'); as error) {
        <p class="field-error">{{ error }}</p>
      }
    </div>

    <div class="form-field">
      <label class="form-label" for="password">Mot de passe</label>
      <input
        id="password"
        class="input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (errorFor('password'); as error) {
        <p class="field-error">{{ error }}</p>
      }
    </div>

    @if (errorMessage(); as message) {
      <p class="alert alert-error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
      Se connecter
    </button>
  </form>
</section>
